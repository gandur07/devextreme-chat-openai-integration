<div class="demo-container">
  <dx-chat [class.chat-disabled]="isDisabled"
           [dataSource]="dataSource"
           [reloadOnChange]="false"
           [showAvatar]="false"
           [showDayHeaders]="false"
           [user]="user"
           height="710"
           [typingUsers]="(typingUsers$ | async) || []"
           [alerts]="(alerts$ | async) || []"
           (onMessageEntered)="onMessageEntered($event)"

           messageTemplate="messageTemplate">
    <div *dxTemplate="let data of 'messageTemplate'">
      <!-- 1) Burbuja: Bienvenida -->
      <ng-container *ngIf="data.message.type === 'form'">
        <form [formGroup]="welcomeForm" (ngSubmit)="onWelcomeSubmit()" class="bubble-card form">

          <h4 class="form-title">Datos básicos</h4>

          <div class="form-grid-12">
            <label class="field span-6">
              <span>Nombres y apellidos</span>
              <input formControlName="nombresApellidos" required
                     [class.invalid]="welcomeForm.get('nombresApellidos')?.invalid && welcomeForm.get('nombresApellidos')?.touched" />
            </label>

            <label class="field span-6">
              <span>Nombre de la empresa</span>
              <input formControlName="nombreEmpresa" />
            </label>

            <label class="field span-6">
              <span>Tipo de identificación</span>
              <div class="select">
                <select formControlName="tipoIdentificacion" required
                        [class.invalid]="welcomeForm.get('tipoIdentificacion')?.invalid && welcomeForm.get('tipoIdentificacion')?.touched">
                  <option [ngValue]="null" disabled>Seleccione…</option>
                  <option [ngValue]="1">Cédula de ciudadanía</option>
                  <option [ngValue]="2">NIT</option>
                  <option [ngValue]="3">Tarjeta de identidad</option>
                  <option [ngValue]="4">Pasaporte</option>
                  <option [ngValue]="5">Otros</option>
                </select>
              </div>
            </label>

            <label class="field span-6">
              <span>Número de identificación</span>
              <input formControlName="numeroIdentificacion" required
                     [class.invalid]="welcomeForm.get('numeroIdentificacion')?.invalid && welcomeForm.get('numeroIdentificacion')?.touched" />
            </label>

            <label class="field span-6">
              <span>Género</span>
              <div class="select">
                <select formControlName="genero">
                  <option [ngValue]="null" disabled>Seleccione…</option>
                  <option [ngValue]="'F'">Femenino</option>
                  <option [ngValue]="'M'">Masculino</option>
                  <option [ngValue]="'O'">Otro / Prefiero no decir</option>
                </select>
              </div>
            </label>

            <label class="field span-6">
              <span>Departamento</span>
              <div class="select">
                <select formControlName="departamentoId" (change)="onDepartmentChange()" required>
                  <option [ngValue]="null" disabled>Seleccione…</option>
                  <option *ngFor="let d of departamentos" [ngValue]="d.id">{{ d.nombre }}</option>
                </select>
              </div>
            </label>

            <label class="field span-6">
              <span>Municipio</span>
              <div class="select">
                <select formControlName="municipioId"
                        [disabled]="loadingMunicipios || !welcomeForm.get('departamentoId')?.value || municipios.length === 0">
                  <option [ngValue]="null" disabled>
                    {{ loadingMunicipios ? 'Cargando…' : 'Seleccione…' }}
                  </option>
                  <option *ngFor="let m of municipios; trackBy: trackById" [ngValue]="m.id">
                    {{ m.nombre }}
                  </option>
                </select>
              </div>
            </label>

            <label class="field span-6">
              <span>Celular</span>
              <input formControlName="numeroCelular" type="tel" />
            </label>

            <label class="field span-12">
              <span>Correo electrónico</span>
              <input formControlName="correoElectronico" type="email" />
            </label>

            <label class="checkbox-row span-12">
              <input type="checkbox" formControlName="acceptTerms" />
              <span>
                Acepto términos y condiciones. La información suministrada será utilizada únicamente
                para fines relacionados con los procesos misionales señalados en los decretos 2409/18 y 2402/19.
              </span>
            </label>

            <div class="actions span-12">
              <button class="btn-outline" type="button" (click)="welcomeForm.reset()">Limpiar</button>
              <button class="btn-primary" type="submit" [disabled]="welcomeForm.invalid">Siguiente</button>
            </div>
          </div>
        </form>
      </ng-container>


      <!-- 3) Burbuja: Opciones rápidas (menú / agente) -->
      <ng-container *ngIf="data.message.type === 'options'">
        <div class="bubble-card options">
          <!--<button class="btn-outline" (click)="sendQuick('Menú principal')">Menú principal</button>-->
          <button class="btn-outline" (click)="openAgent()">Hablar con un agente</button>
        </div>
      </ng-container>

      <!-- 4) Burbuja: Encuesta -->
      <ng-container *ngIf="data.message.type === 'survey'">
        <div class="bubble-card survey" role="group" aria-label="Encuesta de satisfacción">
          <h4 class="survey-title">Ahora cuéntanos tu experiencia con el servicio que acabas de recibir.</h4>

          <!-- Bloque 1: Atención -->
          <div class="survey-row">
            <p class="survey-question">¿En una escala de 1 a 3 cómo calificas la atención?</p>
            <div class="chip-group" role="radiogroup" aria-label="Calificación de atención">
              <button type="button"
                      class="chip chip--good"
                      [class.active]="isSelected('attention', 1)"
                      (click)="setSurvey('attention', 1)"
                      (keydown)="onChipKeydown($event, 'attention', 1)"
                      [attr.aria-pressed]="isSelected('attention', 1)"
                      tabindex="0">
                Bueno
              </button>

              <button type="button"
                      class="chip chip--ok"
                      [class.active]="isSelected('attention', 2)"
                      (click)="setSurvey('attention', 2)"
                      (keydown)="onChipKeydown($event, 'attention', 2)"
                      [attr.aria-pressed]="isSelected('attention', 2)"
                      tabindex="0">
                Aceptable
              </button>

              <button type="button"
                      class="chip chip--bad"
                      [class.active]="isSelected('attention', 3)"
                      (click)="setSurvey('attention', 3)"
                      (keydown)="onChipKeydown($event, 'attention', 3)"
                      [attr.aria-pressed]="isSelected('attention', 3)"
                      tabindex="0">
                Mala
              </button>
            </div>
          </div>

          <!-- Bloque 2: Facilidad -->
          <div class="survey-row">
            <p class="survey-question">En escala de 1 a 3 ¿qué tan fácil fue?</p>
            <div class="chip-group" role="radiogroup" aria-label="Facilidad de uso">
              <button type="button"
                      class="chip chip--good"
                      [class.active]="isSelected('ease', 1)"
                      (click)="setSurvey('ease', 1)"
                      (keydown)="onChipKeydown($event, 'ease', 1)"
                      [attr.aria-pressed]="isSelected('ease', 1)"
                      tabindex="0">
                Muy fácil
              </button>

              <button type="button"
                      class="chip chip--ok"
                      [class.active]="isSelected('ease', 2)"
                      (click)="setSurvey('ease', 2)"
                      (keydown)="onChipKeydown($event, 'ease', 2)"
                      [attr.aria-pressed]="isSelected('ease', 2)"
                      tabindex="0">
                Aceptable
              </button>

              <button type="button"
                      class="chip chip--bad"
                      [class.active]="isSelected('ease', 3)"
                      (click)="setSurvey('ease', 3)"
                      (keydown)="onChipKeydown($event, 'ease', 3)"
                      [attr.aria-pressed]="isSelected('ease', 3)"
                      tabindex="0">
                Difícil
              </button>
            </div>
          </div>

          <!-- Acciones -->
          <div class="actions">
            <button class="btn-primary" (click)="submitSurvey()" [disabled]="!isSurveyComplete()">
              Enviar
            </button>
          </div>

          <div *ngIf="surveySubmitted" class="thanks">¡Gracias por confiar en nosotros! ✅</div>
        </div>
      </ng-container>


      <!-- 5) Burbuja: Texto normal (mantiene tus botones Copiar/Regenerar) -->
      <ng-container *ngIf="!data.message.type || data.message.type === 'text'">
        <div class="dx-chat-messagebubble-text" [innerHTML]="convertToHtml(data.message)"></div>
        <div class="dx-bubble-button-container">
          <dx-button [icon]="copyButtonIcon" stylingMode="text" hint="Copiar" (onClick)="onCopyButtonClick(data.message)"></dx-button>
          <dx-button icon="refresh" stylingMode="text" hint="Regenerar" (onClick)="onRegenerateButtonClick()"></dx-button>
        </div>
      </ng-container>
    </div>
  </dx-chat>
</div>
